services:
  - type: web
    name: telegram-message-panel
    runtime: python

    buildCommand: pip install -r requirements.txt

    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4

    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8

      - key: TELEGRAM_API_ID
        sync: false

      - key: TELEGRAM_API_HASH
        sync: false

      - key: FLASK_SECRET_KEY
        generateValue: true

      - key: TELEGRAM_DATA_DIR
        value: /var/data

    disk:
      name: telegram-sessions
      mountPath: /var/data
      sizeGB: 1
